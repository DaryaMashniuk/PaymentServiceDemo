name: CI

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

jobs:

  verify:
    name: Build and test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Verify
        run: ./mvnw verify