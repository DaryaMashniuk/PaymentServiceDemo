spring:
  application:
    name: paymentServiceDemo

  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bank}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

    jpa:
      open-in-view: false
      hibernate:
        ddl-auto: validate
      properties:
        hibernate:
          jdbc:
            time_zone: UTC

    liquibase:
      change-log: classpath:db/changelog/db.changelog-master.yaml

    data:
      redis:
        host: ${REDIS_HOST:localhost}
        port: ${REDIS_PORT:6379}

app:
  zone-id: Europe/Minsk